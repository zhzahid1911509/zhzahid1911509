name: Generate GitHub Trophies
on:
  schedule:
    - cron: "0 0 * * *" # Runs every midnight
  workflow_dispatch: # Allows manual triggering
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the action to save the image to your repo
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Generate trophy card
        uses: soulteary/github-profile-trophy-action@v1
        with:
          options: 'username=${{ github.repository_owner }}&theme=onedark&column=-1'
          path: trophy.svg
